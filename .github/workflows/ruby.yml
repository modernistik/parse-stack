# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Gem Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Keep stable runner images for the older Ruby versions.
        os: [ubuntu-24.04, macos-15]
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake

  latest-dependencies:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/latest.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: latest
          bundler-cache: true
      - run: bundle exec rake

  rest-integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: test/integration/package-lock.json
      - uses: actions/cache@v4
        with:
          path: /tmp/parse-stack-mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ runner.arch }}-8.0.17
      - run: npm ci --prefix test/integration --no-audit --no-fund
      - run: bundle exec rake integration
